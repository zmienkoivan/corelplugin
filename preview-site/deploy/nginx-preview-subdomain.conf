server {
    listen 80;
    server_name p.evpmerch.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/preview-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://p.evpmerch.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name p.evpmerch.com;

    ssl_certificate /etc/letsencrypt/live/p.evpmerch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p.evpmerch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500m;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
