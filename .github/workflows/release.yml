name: Build and publish Vanya Tools release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check nesting geometry
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.NestingChecks/VanyaTools.NestingChecks.csproj --configuration Release

      - name: Check color proof legend
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.ColorProofLegendChecks/VanyaTools.ColorProofLegendChecks.csproj --configuration Release

      - name: Check raster insertion
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.RasterInsertionChecks/VanyaTools.RasterInsertionChecks.csproj --configuration Release

      - name: Check selection color summary
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.SelectionColorSummaryChecks/VanyaTools.SelectionColorSummaryChecks.csproj --configuration Release

      - name: Check native bitmap pixels
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.NativeBitmapPixelChecks/VanyaTools.NativeBitmapPixelChecks.csproj --configuration Release

      - name: Check order frame capture
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.OrderFrameCaptureChecks/VanyaTools.OrderFrameCaptureChecks.csproj --configuration Release

      - name: Check sublimation failures
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.SublimationFailureChecks/VanyaTools.SublimationFailureChecks.csproj --configuration Release

      - name: Check background order CDR links
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.OrderCdrLinkQueueChecks/VanyaTools.OrderCdrLinkQueueChecks.csproj --configuration Release

      - name: Check docker watchdog
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.DockerWatchdogChecks/VanyaTools.DockerWatchdogChecks.csproj --configuration Release

      - name: Check near white pixels
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.NearWhitePixelChecks/VanyaTools.NearWhitePixelChecks.csproj --configuration Release

      - name: Check native raster models
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.NativeRasterModelChecks/VanyaTools.NativeRasterModelChecks.csproj --configuration Release

      - name: Check native raster filters
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.NativeRasterFilterChecks/VanyaTools.NativeRasterFilterChecks.csproj --configuration Release

      - name: Check native raster pipeline
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.NativeRasterPipelineChecks/VanyaTools.NativeRasterPipelineChecks.csproj --configuration Release

      - name: Check sublimation models
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.SublimationModelsChecks/VanyaTools.SublimationModelsChecks.csproj --configuration Release

      - name: Check monochrome bitmap trim
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.MonochromeTrimChecks/VanyaTools.MonochromeTrimChecks.csproj --configuration Release

      - name: Check background region selection
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.BackgroundRegionChecks/VanyaTools.BackgroundRegionChecks.csproj --configuration Release

      - name: Check sublimation result history
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.SublimationHistoryChecks/VanyaTools.SublimationHistoryChecks.csproj --configuration Release

      - name: Check pending raster recovery
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.PendingRasterChecks/VanyaTools.PendingRasterChecks.csproj --configuration Release

      - name: Check print selection margins
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.PrintSelectionChecks/VanyaTools.PrintSelectionChecks.csproj --configuration Release

      - name: Check update availability probe
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.UpdateAvailabilityChecks/VanyaTools.UpdateAvailabilityChecks.csproj --configuration Release

      - name: Check fast raster PNG and preview
        shell: pwsh
        run: dotnet run --project tests/VanyaTools.RasterSpeedChecks/VanyaTools.RasterSpeedChecks.csproj --configuration Release

      - name: Build installer package
        shell: pwsh
        run: .\package-native.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release/VanyaToolsNative.zip --clobber
          } else {
            gh release create $tag release/VanyaToolsNative.zip --title $tag --generate-notes
          }
